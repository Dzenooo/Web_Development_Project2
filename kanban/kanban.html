<!DOCTYPE html> 
<html lang="en">    
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban ploča</title>
    <link rel="stylesheet" href="./kanban_ploca_stil.css" type="text/css" />
    </head>
    
    <body>
        <h1>Kanban ploča</h1>

        <div class="buttons">
            <button id="addTaskBtn">+ Dodaj zadatak</button>
            <button id="saveBoardBtn">Snimi</button>
            <button id="clearBoardBtn">Očisti ploču</button>
        </div>

        <div id="taskModal" class="modal">
            <div class="modal-content">
                <h3>Dodaj zadatak</h3>
                <input type="text" id="taskInput" placeholder="Vaš zadatak. . ." />
                <div class="modal-buttons">
                    <button id="modalAdd">Dodaj</button>
                    <button id="modalCancel">Poništi</button>
                </div>
            </div>
        </div>
            <div id="clearModal" class="modal">
                <div class="modal-content">
                    <h3>Očisti cijelu ploču</h3>
                    <p>Ova akcija se ne može poništiti.</p>
                    <div class="modal-buttons">
                        <button id="clearYes" style="background: #e74c3c;">Očisti</button>
                        <button id="clearNo">Poništi</button>
                    </div>
                </div>
            </div>
        <div class="board">
            <div class="column" data-status="todo">
                <h2>To Do</h2>
                <div class="taskList"></div>
            </div>
            <div class="column" data-status="progress">
                <h2>In Progress</h2>
                <div class="taskList"></div>
            </div>
            <div class="column" data-status="done">
                <h2>Done</h2>
                <div class="taskList"></div>
            </div>
        </div>
        <footer>
            <p>&copy; 2024 IPI Akademija. Sva prava pridržana.</p>
        </footer>
        <script src="./kanban_ploca_skripta.js"></script>
    </body>
    
</html>
