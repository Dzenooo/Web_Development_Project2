<!DOCTYPE html>
<html lang="en">    
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interaktivni Whiteboard</title>
    <link rel="stylesheet" href="./whiteboard_stil.css" type="text/css" />
    </head>

    <body>
        <h1>Interaktivni Whiteboard</h1>

        <div class="toolbar">
            <label  for="colorPicker">Boja:</label>
            <input type="color" id="colorPicker" value="#000000">

            <label for="brushSize">Veličina četkice:</label>
            <input type="range" id="brushSize" min="1" max="20" value="3">

            <button id="eraserBtn">Obriši</button>
            <button id="clearBtn">Očisti ploču</button>
            <button id="saveBtn">Snimi</button>
        </div>

        <canvas id="board" width="900" height="500"></canvas>

        <footer>
            <p>&copy; 2024 IPI Akademija. Sva prava pridržana.</p>
        </footer>
        <script src="./whiteboard_skripta.js"></script>
    </body>
</html>
