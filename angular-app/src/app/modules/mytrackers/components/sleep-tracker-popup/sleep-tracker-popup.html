<div class="popup-overlay" (click)="closePopup()">
  <div class="popup-content" (click)="$event.stopPropagation()">
    
    <div class="popup-header">
      <h2>😴 Sleep Tracker</h2>
      <button class="close-btn" (click)="closePopup()">✕</button>
    </div>

    <div class="popup-body">
      
      
      <div class="custom-add">
        <label>Koliko si sati spavao?</label>
        <div class="custom-input-group">
          <input 
            type="number" 
            [(ngModel)]="customHours" 
            min="0"
            step="0.5"
            max="24"
            class="form-control"
            placeholder="7. 5"
          />
          <button 
            class="btn btn-primary" 
            (click)="addSleep()"
            [disabled]="loading || ! customHours || customHours <= 0"
          >
            Dodaj spavanje
          </button>
        </div>
      </div>

      
      <div class="date-selector">
        <input 
          type="date" 
          [value]="selectedDate" 
          (change)="onDateChange($event)"
          class="date-input"
        />
      </div>

      
      <div class="entries-section" *ngIf="entries && entries.length > 0">
        <h3>Današnji log</h3>
        <div class="entries-list">
          <div class="entry-item" *ngFor="let entry of entries">
            <span class="entry-time">{{ entry.timestamp }}</span>
            <span class="entry-amount">{{ entry.hours }}h</span>
            <button 
              class="delete-btn" 
              (click)="deleteEntry(entry.id)"
              [disabled]="loading"
            >
              Obriši
            </button>
          </div>
        </div>
        
        
        <div class="total-section">
          <strong>Ukupno:  {{ totalToday }}h</strong>
        </div>
      </div>

      
      <div class="no-entries" *ngIf="! entries || entries.length === 0">
        <p>Nema zabilježenog spavanja za ovaj datum.</p>
      </div>

      
      <div class="chart-section" *ngIf="allLogs && allLogs.length > 0">
        <h3>📊 Historija spavanja (Zadnjih 30 dana)</h3>
        <div class="simple-chart">
          <div 
            class="chart-bar" 
            *ngFor="let log of allLogs. slice(0, 30).reverse()"
            [title]="log.date + ': ' + log.totalToday + 'h'"
          >
            <div 
            class="chart-bar-fill" 
            [style]="'height: ' + ((log.totalToday / 12) * 100) + '%'"
            ></div>
            <span class="chart-label">{{ log.date. substring(8) }}</span>
          </div>
        </div>
      </div>

    </div>

  </div>
</div>
