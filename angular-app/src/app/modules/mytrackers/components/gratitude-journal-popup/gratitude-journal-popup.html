<div class="popup-overlay" (click)="closePopup()">
  <div class="popup-content" (click)="$event.stopPropagation()">
    
    <div class="popup-header">
      <h2>✨ Gratitude Journal</h2>
      <button class="close-btn" (click)="closePopup()">✕</button>
    </div>

    <div class="popup-body">
      
  
      <div class="date-selector">
        <input 
          type="date" 
          [value]="selectedDate" 
          (change)="onDateChange($event)"
          class="date-input"
        />
      </div>


      <div class="journal-section">
        <label>📝 Danas sam zahvalan za... </label>
        <textarea 
          [(ngModel)]="entryText"
          class="journal-textarea"
          placeholder="Napiši za šta si danas zahvalan..."
          rows="6"
          [disabled]="loading"
        ></textarea>

        <div class="button-group">
            <button 
                class="btn btn-primary" 
                (click)="saveEntry()"
                [disabled]="loading"
            >
                {{ loading ? 'Čuvanje...' : 'Sačuvaj' }}
            </button>

            <button 
                class="btn btn-danger" 
                (click)="deleteEntry()"
                [disabled]="loading || !hasEntry"
                *ngIf="hasEntry && entryText.trim()"
            >
                🗑️ Obriši
            </button>
</div>
      </div>

      
      <div class="success-message" *ngIf="showSuccessMessage">
        ✅ Journal entry saved!  ✨
      </div>

      
      <div class="chart-section" *ngIf="allEntries && allEntries.length > 0">
        <h3>📊 Journal History (Last 30 Days)</h3>
        <div class="simple-chart">
          <div 
            class="chart-bar" 
            *ngFor="let entry of allEntries. slice(0, 30).reverse()"
            [title]="entry.date + ': ' + (entry.hasEntry ? '✅ Entry saved' : '❌ No entry')"
          >
            <div 
              class="chart-bar-fill" 
              [style]="'height: ' + (entry.hasEntry ? '100' : '0') + '%'"
              [class.has-entry]="entry.hasEntry"
              [class.no-entry]="!entry.hasEntry"
            ></div>
            <span class="chart-label">{{ entry.date. substring(8) }}</span>
          </div>
        </div>
      </div>

      
      <div class="no-entries" *ngIf="!allEntries || allEntries.length === 0">
        <p>Počni da pišeš svoj gratitude journal!  ✨</p>
      </div>

    </div>

  </div>
</div>
