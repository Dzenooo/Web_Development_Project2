<div class="my-trackers-container">
  
  <div class="trackers-header">
    <h1>My Trackers</h1>
    <p>Track your daily habits and goals</p>
  </div>

  <div class="trackers-grid">
    
    <div class="tracker-card" (click)="openWaterTracker()">
      <div class="tracker-icon">💧</div>
      <h3>Water Tracker</h3>
      <p>Track your daily water intake</p>
    </div>

    <div class="tracker-card" (click)="openMoodTracker()">
      <div class="tracker-icon">😊</div>
      <h3>Mood Tracker</h3>
      <p>Track your emotions... </p>
    </div>

    <div class="tracker-card" (click)="openSleepTracker()">
      <div class="tracker-icon">😴</div>
      <h3>Sleep Tracker</h3>
      <p>Prati svoje spavanje</p>
    </div>

    

    <div class="tracker-card" (click)="openExerciseTracker()">
      <div class="tracker-icon">🏃</div>
      <h3>Exercise Tracker</h3>
      <p>Prati svoje vježbe</p>
    </div>

    <div class="tracker-card disabled">
      <div class="tracker-icon">📝</div>
      <h3>Habit Tracker</h3>
      <p>Coming soon...</p>
    </div>

  </div>

</div>

<app-water-tracker-popup 
  *ngIf="showWaterPopup"
  (close)="closeWaterTracker()">
</app-water-tracker-popup>

<app-mood-tracker-popup 
  *ngIf="showMoodPopup"
  (close)="closeMoodTracker()">
</app-mood-tracker-popup>

<app-sleep-tracker-popup
  *ngIf="showSleepPopup"
  (close)="closeSleepTracker()">
</app-sleep-tracker-popup>

<app-exercise-tracker-popup
  *ngIf="showExercisePopup"
  (close)="closeExerciseTracker()">
</app-exercise-tracker-popup>
